name: CI
on: [push, pull_request]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install -g circom snarkjs
      - run: npm ci
      - run: bash scripts/compile.sh
      - run: npm test
